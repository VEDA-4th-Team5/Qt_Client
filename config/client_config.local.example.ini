[api]
# Copy to client_config.local.ini to override only this workstation.
# Replace the placeholder with the Raspberry Pi's complete URL or hostname.
enabled=true
base_url=http://<raspberry-pi-ip>:8080
# reconnect_interval_ms=5000
# max_reconnect_interval_ms=60000

[mqtt]
# Point at a broker on this workstation instead of the Pi.
follow_api_host=false
host=127.0.0.1
# enabled=true
# topics=parking/fire/+,parking/v1/events/+,parking/v1/state/+
