[api]
# Keep the shared default disabled until a deployment address is configured.
enabled=false
base_url=
slots_path=/api/v1/parking-slots
slot_detail_path=/api/v1/parking-slots/{slot_id}
timeout_ms=5000
reconnect_interval_ms=5000
max_reconnect_interval_ms=60000
# Settings saves a workstation-specific full URL to client_config.local.ini and enables the API.
# Use false when the server is deployed behind HTTPS.
allow_insecure_http=true

[mqtt]
# Real-time push from the Pi. No extra Qt module needed (custom QTcpSocket client).
enabled=false
host=<raspberry-pi-ip>
port=1883
client_id=qt-client
topics=parking/fire/#
reconnect_interval_ms=5000
