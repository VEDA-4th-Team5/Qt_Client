[api]
# Keep the shared default disabled until a deployment address is configured.
enabled=false
base_url=
slots_path=/api/v1/parking-slots
slot_detail_path=/api/v1/parking-slots/{slot_id}
session_images_path=/api/v1/parking-sessions/{session_id}/images
overstay_threshold_path=/api/v1/settings/overstay-threshold
parking_roi_list_path=/api/v1/settings/parking-slots/roi
parking_roi_path=/api/v1/settings/parking-slots/{slot_id}/roi
timeout_ms=5000
reconnect_interval_ms=5000
max_reconnect_interval_ms=60000
# Settings saves a workstation-specific full URL to client_config.local.ini and enables the API.
# Use false when the server is deployed behind HTTPS.
allow_insecure_http=true

[mqtt]
# Real-time push from the Pi. No extra Qt module needed (custom QTcpSocket client).
enabled=false
# By default the broker follows the host in api/base_url.
follow_api_host=true
host=<raspberry-pi-ip>
port=1883
# Shared value is a prefix. Qt generates and persists a unique workstation ID.
client_id=qt-client
topics=parking/fire/+,parking/v1/events/+,parking/v1/state/+
reconnect_interval_ms=5000
