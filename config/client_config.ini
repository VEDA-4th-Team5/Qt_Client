[api]
# No deployment address is assumed. Configure the complete URL in Settings.
enabled=false
base_url=
slots_path=/api/v1/parking-slots
slot_detail_path=/api/v1/parking-slots/{slot_id}
session_images_path=/api/v1/parking-sessions/{session_id}/images
timeout_ms=5000
reconnect_interval_ms=5000
max_reconnect_interval_ms=60000
allow_insecure_http=true

[mqtt]
enabled=false
# The Pi hosts both the API and Mosquitto, so Settings keeps this host synchronized.
follow_api_host=true
host=
port=1883
# Shared value is a prefix. Qt generates qt-client-<12 hex> once per workstation
# and persists the exact ID to client_config.local.ini to prevent broker kicks.
client_id=qt-client
topics=parking/fire/+,parking/v1/events/+,parking/v1/state/+
reconnect_interval_ms=5000
