[camera]
camera_ip=172.20.35.149
username=<username>
password=<password>
rtsp_port=554

# Camera channel index. Final URL pattern: /{channel}/{profile}/media.smp
channel_ch1=0
channel_ch2=1
channel_ch3=2
channel_ch4=3

# Default grid view uses low_profile. Expanded channel uses high_profile.
low_profile=profile3
high_profile=profile2

# Legacy single-stream fallback. If this is set, all channels use it when no quality override is requested.
# rtsp_url=rtsp://<username>:<password>@172.20.35.149:554/0/profile2/media.smp

# Environment override examples. These bypass generated URLs.
# RTSP_CH1_URL=rtsp://<username>:<password>@172.20.35.149:554/0/profile3/media.smp
# RTSP_CH2_URL=rtsp://<username>:<password>@172.20.35.149:554/1/profile3/media.smp
# RTSP_CH3_URL=rtsp://<username>:<password>@172.20.35.149:554/2/profile3/media.smp
# RTSP_CH4_URL=rtsp://<username>:<password>@172.20.35.149:554/3/profile3/media.smp
