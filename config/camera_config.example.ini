[camera]
# Documentation-only address. Replace it with the camera's complete IPv4 address.
camera_ip=192.0.2.10
username=<username>
password=<password>
rtsp_port=554

# WiseAI HTTPS accepts self-signed camera certificates only when their exact
# SHA-256 fingerprint is pinned in the local, Git-ignored camera_config.ini.
# https_certificate_sha256=AA:BB:CC:...:FF
# Runtime overrides: HANWHA_CAMERA_IP, HANWHA_CAMERA_USERNAME,
# HANWHA_CAMERA_PASSWORD, HANWHA_HTTPS_CERT_SHA256

# Camera channel index. Final URL pattern: /{channel}/{profile}/media.smp
channel_ch1=0
channel_ch2=1
channel_ch3=2
channel_ch4=3

# Default grid view uses low_profile. Expanded channel uses high_profile.
low_profile=profile2
high_profile=profile2

# Optional per-channel override. Use this when the camera's highest-quality
# profile differs by channel.
# profile_ch1=profile2
# profile_ch2=profile2
# profile_ch3=profile2
# profile_ch4=profile2

# Legacy single-stream fallback. If this is set, all channels use it when no quality override is requested.
# rtsp_url=rtsp://<username>:<password>@<camera-ip>:554/0/profile2/media.smp

# Environment override examples. These bypass generated URLs.
# RTSP_CH1_URL=rtsp://<username>:<password>@<camera-ip>:554/0/profile3/media.smp
# RTSP_CH2_URL=rtsp://<username>:<password>@<camera-ip>:554/1/profile3/media.smp
# RTSP_CH3_URL=rtsp://<username>:<password>@<camera-ip>:554/2/profile3/media.smp
# RTSP_CH4_URL=rtsp://<username>:<password>@<camera-ip>:554/3/profile3/media.smp
